<svg width="840" height="168" viewBox="0 0 840 168" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Green terminal header</title>
  <desc id="desc">A terminal window with a prompt for Hussain-coder-eng.</desc>
  <rect x="1" y="1" width="838" height="166" rx="8" fill="#050805" stroke="#39FF14" stroke-width="2"/>
  <circle cx="30" cy="28" r="7" fill="#39FF14" opacity="0.95"/>
  <circle cx="54" cy="28" r="7" fill="#7CFF6B" opacity="0.75"/>
  <circle cx="78" cy="28" r="7" fill="#B6FFB0" opacity="0.55"/>
  <path d="M1 52H839" stroke="#39FF14" stroke-width="2" opacity="0.55"/>
  <text x="28" y="96" fill="#39FF14" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="28" font-weight="700">$ whoami</text>
  <text x="28" y="132" fill="#D8FFD4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="26" font-weight="600">Hussain-coder-eng</text>
  <rect x="272" y="111" width="15" height="26" fill="#39FF14">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
